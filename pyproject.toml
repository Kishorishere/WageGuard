[project]
name = "wageguard"
version = "0.0.0"
description = "Auditable US wage-and-hour compliance screening prototype."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "WageGuard" }]

# Runtime dependencies are intentionally minimal in Phase 0.
# Phase-specific dependencies (pydantic, sqlalchemy, fastapi, pgvector,
# httpx, structlog, etc.) are added in the phase that first uses them,
# together with the tests that justify them.
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pyyaml==6.0.2",
    "beautifulsoup4==4.12.3",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-xdist==3.6.1",
    "hypothesis==6.112.1",
    "pip-audit==2.7.3",
    "pre-commit==3.8.0",
    "types-pyyaml==6.0.12.20240917",
    "types-beautifulsoup4==4.12.0.20240907",
]

[project.scripts]
wageguard = "wageguard.interfaces.cli:main"
wageguard-serve = "wageguard.interfaces.api_main:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wageguard"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
# S-1: broad rule selection. Every ignore below is justified inline.
select = [
    "E", "F", "I", "B", "UP", "SIM", "C4", "PL", "RUF", "S", "PT", "ANN",
    "TCH", "N", "A", "DTZ", "T20", "ERA",
]
ignore = [
    # ANN101/ANN102 (self/cls annotations) are noise in modern typed code.
    "ANN101", "ANN102",
    # PLR0913 (too many args): frozen dataclasses legitimately have many fields;
    # architecture tests enforce module/function size separately (S-5).
    "PLR0913",
    # TCH001-003: `if TYPE_CHECKING` adds ceremony without a measurable win
    # for a project of this size; revisit if import cost becomes a concern.
    "TCH001", "TCH002", "TCH003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use `assert`, hard-coded "secrets" in fixtures, and long lines.
"tests/**" = ["S101", "S105", "S106", "ANN201", "PLR2004"]
# The scripts/ tree is operational tooling, not shipped code.
"scripts/**" = ["T201", "S603", "S607"]
# N818 wants an "Error" suffix on every exception class; the names used
# below (InputRejected, LlmTimeout, VerificationFailed, ChainBroken, ...)
# come from the spec's error hierarchy (§7.2) and are the documented
# public API. Renaming them to InputRejectedError etc. would diverge from
# the specification without a review benefit.
"src/wageguard/domain/errors.py" = ["N818"]
# PLR0912 (too many branches) fires on the verifier's main function. The
# verifier's job is to run eight sequential checks and collect every
# failure before returning; splitting the function obscures the
# "ordered-checks" structure spec §12.4 pins down. Keep one function.
"src/wageguard/verification/verifier.py" = ["PLR0912"]
# canonical.to_canonical_dict is a type-dispatch function that must list
# every supported case; by nature it's an if/elif ladder with many
# returns. Splitting into helpers (per type) would hide the exhaustive
# "every type is handled, else raise" structure the ledger depends on.
"src/wageguard/ledger/canonical.py" = ["PLR0911", "PLR0912"]
# scoring.classify is a case table (spec §14.3). The branches ARE the
# table; splitting them hides the exhaustive classification structure.
"src/wageguard/evaluation/scoring.py" = ["PLR0911"]
# The CLI writes human + JSON output to stdout/stderr by design; T201
# is noise in a module whose purpose is printing.
"src/wageguard/interfaces/cli.py" = ["T201", "BLE001", "ANN202"]
# API top-level boundary converts arbitrary errors to HTTP 503.
"src/wageguard/interfaces/api.py" = ["BLE001"]
# Service uses isinstance asserts for type narrowing on dict reads;
# the alternative is a ladder of typed accessors on RawFacts.values,
# which Phase 2 deliberately kept open-ended.
"src/wageguard/interfaces/service.py" = ["S101", "PLR0911"]
# manifest._parse_source is a strict YAML parser; branches are the
# per-field checks from the manifest schema.
"src/wageguard/evidence/manifest.py" = ["PLR0912", "PLR0915"]
# File-backed ledger reads back untyped JSON; isinstance narrowings
# are the local trust boundary.
"src/wageguard/ledger/file_repository.py" = ["S101"]
"src/wageguard/interfaces/composition.py" = ["ANN202"]
# HTTP status range 400..600 is standard and self-documenting.
"src/wageguard/llm/gemini_client.py" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["wageguard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wageguard"]
mypy_path = "src"
# S-2: no Any leaking from domain code.
disallow_any_generics = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
# Stricter rules on the domain core (S-2, S-4).
# wageguard.ledger.canonical is intentionally type-dispatching over
# `object`; `disallow_any_expr` would force structural deformations
# that obscure the type ladder. Strict typing on domain / compliance
# already covers every caller producing values that flow into it.
module = ["wageguard.domain.*", "wageguard.compliance.*"]
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# S-6: markers are a contract. `guarantee` ties every README claim to a test.
markers = [
    "guarantee(id): links a test to a guarantee ID in docs/guarantees.md",
    "integration: requires a real database (not run in unit tier)",
    "property: Hypothesis-driven property test",
    "golden: end-to-end golden-set test (recorded cassettes)",
    "failure_injection: resilience test using fault-injecting ports",
    "architecture: structural rule enforced via AST or import graph",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-p", "no:cacheprovider",
]
filterwarnings = [
    "error",
    # Transitive deprecation from starlette<->anyio alias; fires at
    # test-client import. Revisit when the versions bump.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
xfail_strict = true

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/wageguard"]
parallel = true

[tool.coverage.report]
# Overall project floor (S-1). Per-package floors (95% on compliance/,
# ledger/, citations/) are enforced in CI via a dedicated job that runs
# coverage on those packages in isolation.
fail_under = 85
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# --------------------------------------------------------------------------
# uv — creates and manages .venv/ in the repo root; uv.lock is committed
# for hermetic installs (S-7). Dev deps are under [project.optional-dependencies]
# so they are also installable via plain `pip install -e .[dev]`.
# --------------------------------------------------------------------------
