name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    name: lint + types + architecture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.20"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync frozen dependencies
        run: uv sync --frozen --extra dev

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format check)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: architecture tests
        run: uv run pytest -m architecture -q

      - name: docs-check (guarantee registry)
        run: uv run python scripts/check_guarantees.py

  unit-and-property:
    name: unit + property tests
    runs-on: ubuntu-24.04
    needs: lint-and-types
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.20"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: pytest (unit + property + architecture)
        run: >
          uv run pytest
          -m "not integration and not golden and not failure_injection"
          --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage.xml

  integration:
    name: integration (Postgres + pgvector)
    runs-on: ubuntu-24.04
    needs: lint-and-types
    services:
      postgres:
        # VERIFY: replace the tag with a @sha256 digest pin before Phase 4
        # lands rules that reference real values. Phase 0 keeps the tag to
        # avoid fabricating a digest; CI still runs because the service
        # just needs pgvector support.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wageguard
          POSTGRES_PASSWORD: wageguard
          POSTGRES_DB: wageguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wageguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAGEGUARD_DATABASE_URL: postgresql+psycopg://wageguard:wageguard@localhost:5432/wageguard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.20"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Enable pgvector extension
        run: |
          PGPASSWORD=wageguard psql -h localhost -U wageguard -d wageguard \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: pytest (integration)
        run: uv run pytest -m integration -q

  golden-on-cassettes:
    name: golden suite (cassettes, offline)
    runs-on: ubuntu-24.04
    needs: lint-and-types
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.20"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: golden (cassettes only; no network)
        env:
          WAGEGUARD_LLM_PROVIDER: cassette
        run: uv run pytest -m golden -q

  security:
    name: pip-audit + gitleaks
    runs-on: ubuntu-24.04
    needs: lint-and-types
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.20"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: pip-audit
        run: uv run pip-audit --strict
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
