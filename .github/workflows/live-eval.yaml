name: live-eval

# Manually triggered. Runs the golden suite against a live provider
# (Gemini or Groq). The cassette-replayed job in ci.yaml is what gates
# merges; this job is for drift investigations and cassette refreshes.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider"
        required: true
        default: "gemini"
        type: choice
        options: [gemini, groq]
      split:
        description: "Golden split to run"
        required: true
        default: "dev"
        type: choice
        options: [dev, heldout, all]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    environment: live-eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.20"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev

      - name: Run golden (live)
        env:
          WAGEGUARD_LLM_PROVIDER: ${{ inputs.provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          uv run pytest -m golden --golden-live \
            --golden-split=${{ inputs.split }} -q

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-live-${{ inputs.provider }}-${{ inputs.split }}
          path: reports/
